<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Exclusive Album (mockup)</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
color:white;
overflow:hidden;
}

canvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
}

.container{

min-height:100vh;
min-height:100svh;

display:flex;
justify-content:center;
align-items:center;

padding:20px;

box-sizing:border-box;

}

.player{

width:90%;
max-width:420px;

max-height:85vh;
max-height:85svh;

overflow-y:auto;

padding:25px;

border-radius:25px;

background:rgba(0,0,0,.35);

-webkit-backdrop-filter:blur(15px);
backdrop-filter:blur(15px);

box-shadow:
0 0 40px rgba(255,220,180,.15);

}

.cover{

display:block;

width:50%;

margin:auto;

margin-bottom:15px;

border-radius:15px;

box-shadow:
0 0 25px rgba(255,220,180,.25);

}

.trackTitle{

font-size:22px;
font-weight:bold;

text-align:center;

margin-bottom:5px;

}

.artist{

text-align:center;

opacity:.7;

margin-bottom:15px;

}


.progress{

width:100%;

appearance:none;

background:transparent;

}


.progress::-webkit-slider-runnable-track{

height:6px;

border-radius:10px;

background:
rgba(255,220,150,.25);

}


.progress::-webkit-slider-thumb{

-webkit-appearance:none;

width:18px;
height:18px;

margin-top:-6px;

border-radius:50%;

background:
rgb(255,220,150);

box-shadow:
0 0 10px rgba(255,220,150,.8);

}

.progress::-moz-range-track{

height:6px;

border-radius:10px;

background:
rgba(255,220,150,.25);

}

.progress::-moz-range-thumb{

width:18px;
height:18px;

border:none;

border-radius:50%;

background:
rgb(255,220,150);

}


.time{

display:flex;

justify-content:space-between;

font-size:12px;

margin-top:5px;

opacity:.8;

}

.controls{

display:flex;

justify-content:center;

gap:10px;

margin-top:15px;

flex-wrap:wrap;

}

button{

-webkit-appearance:none;
-moz-appearance:none;
appearance:none;

display:inline-flex;
align-items:center;
justify-content:center;

margin:0;

padding:10px 14px;

border:none;

border-radius:12px;

cursor:pointer;

font-family:inherit;
font-size:16px;
line-height:1;

background:
rgba(255,255,255,.15);

color:white;

-webkit-tap-highlight-color:transparent;
touch-action:manipulation;
user-select:none;
-webkit-user-select:none;

transition:background .15s,transform .1s;

}

button:hover{

background:
rgba(255,255,255,.25);

}

button:active{

transform:scale(.94);

}

button:focus{

outline:none;

}

button:focus-visible{

outline:2px solid rgba(255,220,150,.9);
outline-offset:2px;

}

#prev,
#play,
#next{

background:
rgba(255,255,255,.27);

}

#prev:hover,
#play:hover,
#next:hover{

background:
rgba(255,255,255,.37);

}

.controls button{

min-width:46px;
height:42px;

padding:0 12px;

}

.controlRow{

display:flex;
flex-direction:column;
align-items:center;

gap:12px;

margin-top:15px;

}

.controlRow .controls,
.controlRow .extras{

margin-top:0;

}

.controlRow .controls{

flex-wrap:nowrap;
justify-content:center;

}

.controlRow .extras{

position:relative;
justify-content:center;

}

#timerDisplay{

position:absolute;
left:100%;

margin-left:8px;

white-space:nowrap;

}

@media (max-width:430px){

.player{
padding:20px;
}

.controlRow{
gap:10px;
}

.controlRow .controls{
gap:6px;
}

.controlRow .controls button{
min-width:38px;
padding:0 8px;
}

.extras{
gap:5px;
}

.extras button{
min-width:30px;
height:28px;
padding:0 6px;
}

#timerDisplay{
font-size:11px !important;
}

}

.extras{

display:flex;
justify-content:flex-start;
align-items:center;

gap:8px;

margin-top:12px;

}

.extras button{

min-width:30px;
height:28px;

padding:0 6px;

border-radius:9px;

}

.extras .ic{

width:14px;
height:14px;

}

.ic{

width:20px;
height:20px;

display:block;

fill:currentColor;

pointer-events:none;

}

.ic.stroke{

fill:none;

stroke:currentColor;
stroke-width:2;
stroke-linecap:round;
stroke-linejoin:round;

}

.dim{

opacity:.55;

}

.activeButton,
.activeButton:hover{

background:
rgba(255,220,150,.5);

}

.activeButton.repeatOne,
.activeButton.repeatOne:hover{

background:
rgba(205,148,58,.65);

}

#timerBtn.activeButton{

animation:timerPulse 2.6s ease-in-out infinite;

}

@keyframes timerPulse{

0%,100%{
box-shadow:0 0 4px rgba(255,220,150,.15);
}

50%{
box-shadow:0 0 16px rgba(255,220,150,.75);
}

}

@media (prefers-reduced-motion:reduce){

#timerBtn.activeButton{
animation:none;
}

}

#timerDisplay{

align-self:center;

font-variant-numeric:tabular-nums;

}

.playlist{

margin-top:20px;

max-height:220px;

overflow-y:auto;

}

.song{

display:flex;

align-items:center;

padding:10px;

border-radius:10px;

margin-bottom:4px;

}

.song:hover{

background:
rgba(255,255,255,.1);

}

.activeSong{

background:
rgba(255,220,150,.25);

}

.check{

cursor:pointer;

margin-right:10px;

display:inline-flex;

color:rgb(255,220,150);

}

.check .ic{

width:22px;
height:22px;

}

.songTitle{

cursor:pointer;

}


/* FADE-OUT TIMER POP-UP */

.timerBackdrop{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:
rgba(2,8,35,.6);

-webkit-backdrop-filter:blur(2px);
backdrop-filter:blur(2px);

z-index:9;

animation:tmFade .22s ease-out;

}

@keyframes tmFade{

from{opacity:0;}
to{opacity:1;}

}

.timerModal{

position:fixed;

left:50%;
bottom:20px;

transform:translateX(-50%);

width:90%;
max-width:420px;

box-sizing:border-box;

padding:22px 25px;

border-radius:25px;

background:
linear-gradient(160deg,rgba(40,80,190,.55),rgba(10,24,85,.65));

border:1px solid rgba(255,220,150,.25);

-webkit-backdrop-filter:blur(18px);
backdrop-filter:blur(18px);

box-shadow:
0 0 40px rgba(255,220,180,.18),
0 10px 40px rgba(0,10,50,.5);

color:white;

z-index:10;

animation:tmIn .22s ease-out;

}

@keyframes tmIn{

from{
opacity:0;
transform:translateX(-50%) translateY(18px);
}

to{
opacity:1;
transform:translateX(-50%) translateY(0);
}

}

.tmTitle{

text-align:center;

font-size:18px;
font-weight:bold;

margin-bottom:16px;

color:rgb(255,220,150);

}

.tmPresets{

display:grid;
grid-template-columns:repeat(4,1fr);

gap:8px;

}

.tmPresets button{

padding:11px 0;

font-size:15px;

}

.tmPresets button:hover{

background:
rgba(255,220,150,.35);

}

.tmCustom{

display:flex;
justify-content:center;
align-items:center;

flex-wrap:wrap;

gap:16px;

margin-top:18px;

font-size:14px;

opacity:.95;

}

.tmCustom label{

display:flex;
align-items:center;

gap:8px;

}

.tmCustom input{

width:58px;

box-sizing:border-box;

padding:8px 6px;

border-radius:10px;

border:1px solid rgba(255,220,150,.35);

background:
rgba(255,255,255,.12);

color:white;

font-family:inherit;
font-size:16px;

text-align:center;

color-scheme:dark;

}

.tmCustom input:focus{

outline:none;

border-color:rgb(255,220,150);

box-shadow:
0 0 8px rgba(255,220,150,.5);

}

.tmActions{

display:flex;
flex-wrap:wrap;
justify-content:center;

gap:10px;

margin-top:20px;

}

.tmActions button{

min-width:96px;

padding:11px 18px;

font-size:15px;

}

.tmActions .tmStop{

background:
rgba(214,100,38,.5);

}

.tmActions .tmStop:hover{

background:
rgba(214,100,38,.68);

}

.tmActions .tmStart,
.tmActions .tmStart:hover{

background:
rgba(255,220,150,.5);

font-weight:bold;

}

.tmActions .tmStart:hover{

background:
rgba(255,220,150,.65);

}

/* TITLE FONT: Macondo (web font, identical on every device) */

.trackTitle,
.artist,
.songTitle,
.tmTitle{

font-family:"Macondo",Papyrus,fantasy;

font-weight:normal;

letter-spacing:.3px;

}

.trackTitle{

font-size:24px;

line-height:1.3;

}

.artist{

font-size:15px;

}

.songTitle{

font-size:16px;

}

.tmTitle{

font-size:21px;

}

<body>

<canvas id="bg"></canvas>

<div class="container">

<div class="player">

<img
src="cover.png"
class="cover">

<div
class="trackTitle"
id="title">

Loading...

</div>

<div class="artist">

Exclusive Album (Mock-up)

</div>

<input
class="progress"
id="progress"
type="range"
value="0"
min="0"
max="100">

<div class="time">

<span id="current">
0:00
</span>

<span id="duration">
0:00
</span>

</div>


<div class="controlRow">

<div class="controls">

<button id="prev" aria-label="Previous track" title="Previous"></button>

<button id="play" aria-label="Play / pause" title="Play / pause"></button>

<button id="next" aria-label="Next track" title="Next"></button>

</div>

<div class="extras">

<button id="repeat" aria-label="Repeat" title="Repeat"></button>

<button id="shuffle" aria-label="Shuffle" title="Shuffle"></button>

<button id="timerBtn" aria-label="Fade-out timer" title="Fade-out timer"></button>

<span id="timerDisplay" style="font-size:12px;opacity:.8;"></span>

</div>

</div>


<div
class="playlist"
id="playlist">

</div>

</div>

</div>



<div id="timerBackdrop" class="timerBackdrop" style="display:none" onclick="closeTimer()"></div>

<div id="timerModal" class="timerModal" role="dialog" aria-modal="true" aria-label="Fade-out timer" style="display:none">

<div class="tmTitle">Fade-out timer</div>

<div class="tmPresets">
<button onclick="startTimer(15)">15m</button>
<button onclick="startTimer(30)">30m</button>
<button onclick="startTimer(45)">45m</button>
<button onclick="startTimer(60)">60m</button>
</div>

<label>Hours <input id="th" type="number" min="0" value="0"></label>
<label>Minutes <input id="tm" type="number" min="0" value="30"></label>
</div>

<button class="tmStart" onclick="startCustomTimer()">Start</button>
<button id="tmStop" class="tmStop" style="display:none" onclick="cancelTimer()">Stop timer</button>

</div>

</div>

<audio id="audio"></audio>


<script>

const tracks=[

{
title:"G'day",
file:"G'day.mp3",
enabled:true
},

{
title:"The Grape's Kiss",
file:"The Grape's Kiss.mp3",
enabled:true
},

{
title:"Tapestry",
file:"Tapestry.mp3",
enabled:true
}

];


let currentTrack=0;

let repeatMode=0;

let shuffle=false;


const audio=
document.getElementById("audio");

const title=
document.getElementById("title");

const playBtn=
document.getElementById("play");

const progress=
document.getElementById("progress");

const current=
document.getElementById("current");

const duration=
document.getElementById("duration");

const repeatBtn=
document.getElementById("repeat");

const shuffleBtn=
document.getElementById("shuffle");

const playlist=
document.getElementById("playlist");


// Icons are inline SVG so they look identical in every browser and OS
const ICONS={
prev:{fill:true,body:'<path d="M6 5h2.2v14H6z"/><path d="M20 5.2v13.6L9.2 12z"/>'},
next:{fill:true,body:'<path d="M15.8 5H18v14h-2.2z"/><path d="M4 5.2v13.6L14.8 12z"/>'},
play:{fill:true,body:'<path d="M7 4.6v14.8L19.5 12z"/>'},
pause:{fill:true,body:'<rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/>'},
repeat:{body:'<path d="M17 2.5l4 4-4 4"/><path d="M3 11.5v-1.5a3.5 3.5 0 0 1 3.5-3.5H21"/><path d="M7 21.5l-4-4 4-4"/><path d="M21 12.5v1.5a3.5 3.5 0 0 1-3.5 3.5H3"/>'},
repeatOne:{body:'<path d="M17 2.5l4 4-4 4"/><path d="M3 11.5v-1.5a3.5 3.5 0 0 1 3.5-3.5H21"/><path d="M7 21.5l-4-4 4-4"/><path d="M21 12.5v1.5a3.5 3.5 0 0 1-3.5 3.5H3"/><path d="M11 10.5l1.6-1v7"/>'},
shuffle:{body:'<path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/>'},
timer:{body:'<circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 2.5"/><path d="M9.5 2.5h5"/>'},
checkOn:{body:'<rect x="3.5" y="3.5" width="17" height="17" rx="4.5" style="fill:rgba(255,220,150,.28)"/><path d="M8 12.5l3 3 5.2-6"/>'},
checkOff:{body:'<rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/>'}
};

function icon(name){
const i=ICONS[name];
return '<svg class="ic'+(i.fill?'':' stroke')+'" viewBox="0 0 24 24" aria-hidden="true">'+i.body+'</svg>';
}

function setIcon(btn,name){
btn.innerHTML=icon(name);
}

setIcon(document.getElementById("prev"),"prev");
setIcon(document.getElementById("play"),"play");
setIcon(document.getElementById("next"),"next");
setIcon(document.getElementById("repeat"),"repeat");
document.getElementById("repeat").classList.add("dim");
setIcon(document.getElementById("shuffle"),"shuffle");
document.getElementById("shuffle").classList.add("dim");
setIcon(document.getElementById("timerBtn"),"timer");



function getEnabledTracks(){

return tracks
.map((t,i)=>t.enabled?i:null)
.filter(i=>i!==null);

}


function loadTrack(i){

if(i===undefined||i===null||!tracks[i])
return;

currentTrack=i;

audio.src=
encodeURI(tracks[i].file);

title.innerText=
tracks[i].title;

audio.load();

renderPlaylist();

}


function safePlay(){

const p=audio.play();

if(p&&p.catch){
p.catch(err=>{
if(err&&err.name==="AbortError")return;
console.warn("Playback was prevented:",err);
setIcon(playBtn,"play");
});
}

}


function playTrack(i){

if(!tracks[i])
return;

loadTrack(i);

safePlay();

setIcon(playBtn,"pause");

}


function renderPlaylist(){

let html="";

tracks.forEach((t,i)=>{

html+=`

<div class="
song
${i===currentTrack?"activeSong":""}
">

<span
class="check"
onclick="toggleTrack(${i})">

${t.enabled?icon("checkOn"):icon("checkOff")}

</span>

<span
class="songTitle"
onclick="playTrack(${i})">

${i+1}. ${t.title}

</span>

</div>

`;

});

playlist.innerHTML=
html;

}


function toggleTrack(i){

const enabled=getEnabledTracks();

if(tracks[i].enabled&&enabled.length<=1){

return;

}

tracks[i].enabled=
!tracks[i].enabled;

renderPlaylist();

}



loadTrack(0);



playBtn.onclick=()=>{

if(audio.paused){

title.innerText=
tracks[currentTrack].title;

safePlay();

setIcon(playBtn,"pause");

}
else{

audio.pause();

setIcon(playBtn,"play");

}

};



repeatBtn.onclick=()=>{

repeatMode++;

if(repeatMode>2)
repeatMode=0;

setIcon(repeatBtn,repeatMode===2?"repeatOne":"repeat");

repeatBtn.classList.toggle("dim",repeatMode===0);

repeatBtn.classList.toggle("activeButton",repeatMode!==0);

repeatBtn.classList.toggle("repeatOne",repeatMode===2);

};



shuffleBtn.onclick=()=>{

shuffle=!shuffle;

shuffleBtn.classList.toggle(
"activeButton"
);

shuffleBtn.classList.toggle("dim",!shuffle);

};



function nextTrack(){

let enabled=
getEnabledTracks();

if(enabled.length===0)
return;

if(repeatMode===2){

audio.currentTime=0;
safePlay();

return;

}

if(shuffle){

currentTrack=

enabled[
Math.floor(
Math.random()
*
enabled.length
)];

}
else{

let pos=
enabled.indexOf(
currentTrack
);

pos++;

if(pos>=enabled.length){

if(repeatMode===1){

pos=0;

}
else{

audio.pause();

setIcon(playBtn,"play");

return;

}

}

currentTrack=
enabled[pos];

}

playTrack(currentTrack);

}



document
.getElementById("next")
.onclick=nextTrack;



document
.getElementById("prev")
.onclick=()=>{

let enabled=
getEnabledTracks();

if(enabled.length===0)
return;

let pos=
enabled.indexOf(
currentTrack
);

pos--;

if(pos<0)
pos=
enabled.length-1;

playTrack(
enabled[pos]
);

};


audio.addEventListener(
"ended",
nextTrack
);


audio.addEventListener(
"timeupdate",
()=>{

progress.value=
(audio.currentTime/audio.duration)
*100||0;

current.innerText=
format(
audio.currentTime
);

duration.innerText=
format(
isFinite(audio.duration)?audio.duration:0
);

if(safeGetStorage("sleepTimerEnd"))updateTimer();

});


progress.oninput=()=>{

if(isFinite(audio.duration)&&audio.duration>0){

audio.currentTime=
(progress.value/100)
*
audio.duration;

}

};


audio.addEventListener(
"error",
()=>{

console.warn(
"Playback error for track:",
tracks[currentTrack]&&tracks[currentTrack].file
);

title.innerText="Unable to play this track";

setIcon(playBtn,"play");

}
);


function format(sec){

if(!sec)
return "0:00";

let m=
Math.floor(sec/60);

let s=
Math.floor(sec%60);

if(s<10)
s="0"+s;

return m+":"+s;

}



// BACKGROUND: "Ripples on the pond" - turquoise water, ripples, lily pads, water plants
const c=document.getElementById("bg");
const ctx=c.getContext("2d");
let animationFrameId = null;
let isPageVisible = true;
let patternLayer=null;

// Seeded random so the hand-made look stays the same on every load / resize
let seed=20261018;
function rand(){
 seed|=0; seed=seed+0x6D2B79F5|0;
 let t=Math.imul(seed^seed>>>15,1|seed);
 t=t+Math.imul(t^t>>>7,61|t)^t;
 return ((t^t>>>14)>>>0)/4294967296;
}
function rr(a,b){return a+rand()*(b-a);}

// A slightly irregular, hand-drawn ripple ring (squashed for pond perspective)
function wobblyRing(g,cx,cy,r,sq,wob){
 const n=56;
 const p1=rand()*6.28, p2=rand()*6.28;
 g.beginPath();
 for(let k=0;k<=n;k++){
   const a=k/n*Math.PI*2;
   const rad=r*(1+wob*Math.sin(a*3+p1)+wob*0.6*Math.sin(a*5+p2));
   const x=cx+Math.cos(a)*rad;
   const y=cy+Math.sin(a)*rad*sq;
   if(k===0) g.moveTo(x,y); else g.lineTo(x,y);
 }
}

// A cluster of concentric ripples spreading from one point
function drawRippleCluster(g,cx,cy,size){
 const rings=Math.floor(rr(4,8));
 const gap=size/rings;
 const sq=rr(0.5,0.62);
 for(let i=0;i<rings;i++){
   const r=gap*0.5+i*gap*rr(0.92,1.12);
   const fade=1-i/rings;
   const orange=(i%4===2)&&rand()<0.6;
   g.strokeStyle=orange
     ?"rgba(240,140,55,"+(0.28+0.4*fade)+")"
     :"rgba(255,236,190,"+(0.20+0.42*fade)+")";
   g.lineWidth=rr(1.0,2.2)*(0.6+fade*0.6);
   if(rand()<0.35){
     g.setLineDash([rr(14,40),rr(5,16)]);
   }else{
     g.setLineDash([]);
   }
   wobblyRing(g,cx,cy,r,sq,rr(0.01,0.035));
   g.stroke();
 }
 g.setLineDash([]);

 // faint lighter water inside the first ring
 const rg=g.createRadialGradient(cx,cy,0,cx,cy,gap*1.6);
 rg.addColorStop(0,"rgba(190,225,255,0.20)");
 rg.addColorStop(1,"rgba(190,225,255,0)");
 g.save();
 g.translate(cx,cy);
 g.scale(1,sq);
 g.translate(-cx,-cy);
 g.fillStyle=rg;
 g.fillRect(cx-gap*1.6,cy-gap*1.6,gap*3.2,gap*3.2);
 g.restore();
}

// A lily pad with a notch, veins and a rim, drawn flat on the pond
function drawLilyPad(g,cx,cy,r,orange){
 const sq=rr(0.55,0.7);
 const rot=rand()*Math.PI*2;
 const notch=rr(0.22,0.34);
 const col=orange?"rgba(214,104,40,0.55)":"rgba(38,150,112,0.62)";
 const rim=orange?"rgba(255,205,140,0.6)":"rgba(200,245,215,0.55)";

 g.save();
 g.translate(cx,cy);
 g.scale(1,sq);
 g.rotate(rot);

 g.beginPath();
 g.moveTo(0,0);
 g.arc(0,0,r,notch,Math.PI*2-notch);
 g.closePath();
 g.fillStyle=col;
 g.fill();
 g.strokeStyle=rim;
 g.lineWidth=1.4;
 g.stroke();

 // veins
 g.strokeStyle="rgba(255,240,200,0.35)";
 g.lineWidth=0.8;
 for(let k=0;k<9;k++){
   const a=notch+(Math.PI*2-notch*2)*(k+0.5)/9;
   g.beginPath();
   g.moveTo(0,0);
   g.lineTo(Math.cos(a)*r*0.92,Math.sin(a)*r*0.92);
   g.stroke();
 }
 g.restore();

 // soft shadow in the water under the pad
 g.fillStyle="rgba(0,25,70,0.14)";
 g.beginPath();
 g.ellipse(cx+3,cy+4,r*1.02,r*sq*1.02,0,0,Math.PI*2);
 g.fill();
}

// A small lotus flower in cream and orange
function drawLotus(g,cx,cy,r){
 const petals=8;
 for(let ring=0;ring<2;ring++){
   for(let k=0;k<petals;k++){
     const a=k/petals*Math.PI*2+ring*Math.PI/petals+rr(-0.08,0.08);
     const len=r*(ring?0.62:1);
     const px=Math.cos(a), py=Math.sin(a)*0.62;
     const tx=cx+px*len, ty=cy+py*len;
     const nx=-py, ny=px;
     const w=len*0.34;
     g.beginPath();
     g.moveTo(cx,cy);
     g.quadraticCurveTo(cx+px*len*0.5+nx*w,cy+py*len*0.5+ny*w,tx,ty);
     g.quadraticCurveTo(cx+px*len*0.5-nx*w,cy+py*len*0.5-ny*w,cx,cy);
     g.fillStyle=ring?"rgba(246,150,70,0.85)":"rgba(255,236,205,0.78)";
     g.fill();
     g.strokeStyle="rgba(255,255,235,0.55)";
     g.lineWidth=0.8;
     g.stroke();
   }
 }
 g.fillStyle="rgba(255,205,90,0.9)";
 g.beginPath();
 g.arc(cx,cy,r*0.13,0,Math.PI*2);
 g.fill();
}

// A single leaf with a midrib (for trailing water plants)
function drawLeaf(g,x,y,ang,size,orange){
 const tx=x+Math.cos(ang)*size, ty=y+Math.sin(ang)*size;
 const px=-Math.sin(ang), py=Math.cos(ang);
 const mx=x+Math.cos(ang)*size*0.5, my=y+Math.sin(ang)*size*0.5;
 const w=size*0.38;

 g.beginPath();
 g.moveTo(x,y);
 g.quadraticCurveTo(mx+px*w,my+py*w,tx,ty);
 g.quadraticCurveTo(mx-px*w,my-py*w,x,y);
 g.closePath();

 g.fillStyle=orange?"rgba(226,112,42,0.60)":"rgba(150,225,195,0.50)";
 g.fill();
 g.strokeStyle="rgba(255,230,175,0.45)";
 g.lineWidth=0.8;
 g.stroke();

 g.beginPath();
 g.moveTo(x,y);
 g.lineTo(mx+(tx-mx)*0.8,my+(ty-my)*0.8);
 g.strokeStyle="rgba(255,230,175,0.35)";
 g.stroke();
}

// Spiral tendril at the end of a water-plant vine
function drawCurl(g,x,y,ang,size){
 g.beginPath();
 g.moveTo(x,y);
 const dir=rand()<.5?1:-1;
 let a=ang, r=size, px=x, py=y;
 for(let k=0;k<18;k++){
   a+=dir*0.45;
   r*=0.9;
   px+=Math.cos(a)*r*0.5;
   py+=Math.sin(a)*r*0.5;
   g.lineTo(px,py);
 }
 g.lineWidth=1.3;
 g.stroke();
}

// Meandering trailing vine with leaves, buds and branches
function growVine(g,x,y,ang,len,wd,depth,col){

 const step=8;
 const n=Math.floor(len/step);
 let px=x,py=y,a=ang;
 let drift=(rand()-.5)*0.12;
 let side=rand()<.5?1:-1;

 g.lineCap="round";
 g.lineJoin="round";

 for(let s=0;s<n;s++){

   drift+=(rand()-.5)*0.07;
   drift=Math.max(-0.16,Math.min(0.16,drift))*0.97;
   a+=drift;

   const nx=px+Math.cos(a)*step;
   const ny=py+Math.sin(a)*step;
   const prog=s/n;

   g.strokeStyle=col;
   g.lineWidth=Math.max(0.9,wd*(1-prog*0.65));
   g.beginPath();
   g.moveTo(px,py);
   g.lineTo(nx,ny);
   g.stroke();

   const leafSize=rr(12,19)*(1-prog*0.45);

   if(s%3===1){
     drawLeaf(g,nx,ny,a+side*rr(0.8,1.3),leafSize,rand()<0.45);
     side=-side;
   }

   if(rand()<0.045){
     g.fillStyle="rgba(240,130,45,0.85)";
     g.beginPath();
     g.arc(nx+rr(-5,5),ny+rr(-5,5),rr(2.5,3.8),0,Math.PI*2);
     g.fill();
   }

   if(depth>0&&s>3&&s<n-4&&rand()<0.06){
     growVine(g,nx,ny,a+(rand()<.5?1:-1)*rr(0.6,1.1),len*0.42,wd*0.7,depth-1,col);
     g.lineCap="round";
   }

   px=nx;py=ny;
 }

 g.strokeStyle=col;
 drawCurl(g,px,py,a,14);
}

function buildPattern(){

 seed=20261018;

 const w=c.width, h=c.height;
 const base=document.createElement("canvas");
 base.width=w; base.height=h;
 const g=base.getContext("2d");
 const big=Math.max(w,h);

 // 1. Pond water: deeper at the edges, lighter turquoise in the middle
 const bg=g.createLinearGradient(0,0,w,h);
 bg.addColorStop(0,"rgb(36,128,196)");
 bg.addColorStop(0.5,"rgb(26,82,180)");
 bg.addColorStop(1,"rgb(14,44,128)");
 g.fillStyle=bg;
 g.fillRect(0,0,w,h);

 // 2. Mottled depth in the water, with a few warm orange reflections
 for(let i=0;i<46;i++){
   const x=rand()*w, y=rand()*h, r=rr(0.08,0.28)*big;
   const k=rand();
   let col;
   if(k<0.34) col="95,170,240,0.20";
   else if(k<0.68) col="6,30,105,0.26";
   else if(k<0.84) col="235,222,185,0.07";
   else col="214,100,38,0.15";
   const rg=g.createRadialGradient(x,y,0,x,y,r);
   rg.addColorStop(0,"rgba("+col+")");
   rg.addColorStop(1,"rgba("+col.replace(/,[^,]*$/,",0")+")");
   g.fillStyle=rg;
   g.fillRect(x-r,y-r,r*2,r*2);
 }

 // sunset-like warm reflection on the water
 const warm=g.createRadialGradient(w*0.95,h*1.0,0,w*0.95,h*1.0,big*0.7);
 warm.addColorStop(0,"rgba(226,112,42,0.32)");
 warm.addColorStop(1,"rgba(226,112,42,0)");
 g.fillStyle=warm;
 g.fillRect(0,0,w,h);

 const warm2=g.createRadialGradient(w*0.02,h*0.02,0,w*0.02,h*0.02,big*0.45);
 warm2.addColorStop(0,"rgba(232,130,50,0.22)");
 warm2.addColorStop(1,"rgba(232,130,50,0)");
 g.fillStyle=warm2;
 g.fillRect(0,0,w,h);

 // 3. Fine surface grain
 const grains=Math.floor(w*h/120);
 for(let i=0;i<grains;i++){
   g.fillStyle=rand()<0.5?"rgba(255,255,240,"+rr(0.02,0.07)+")":"rgba(0,20,75,"+rr(0.03,0.10)+")";
   g.fillRect(rand()*w,rand()*h,rr(0.8,2.2),rr(0.8,2.2));
 }

 // 4. Ornament layer (ripples, lily pads, lotus, water plants) so it can be worn away
 const orn=document.createElement("canvas");
 orn.width=w; orn.height=h;
 const o=orn.getContext("2d");

 // ripple clusters, spread in a loose grid with jitter so they cover the pond
 const cell=Math.max(150,Math.min(230,Math.min(w,h)/3));
 const cols=Math.ceil(w/cell)+1;
 const rows=Math.ceil(h/cell)+1;
 for(let j=0;j<rows;j++){
   for(let i=0;i<cols;i++){
     if(rand()<0.18) continue;
     const x=(i+rr(0.1,0.9))*cell-cell*0.25;
     const y=(j+rr(0.1,0.9))*cell-cell*0.25;
     drawRippleCluster(o,x,y,cell*rr(0.55,0.95));
   }
 }

 // lily pads, some with a lotus flower
 const padCount=Math.round(w*h/52000)+5;
 for(let i=0;i<padCount;i++){
   const x=rand()*w, y=rand()*h, r=rr(22,48);
   drawLilyPad(o,x,y,r,rand()<0.22);
   if(rand()<0.3) drawLotus(o,x+rr(-6,6),y+rr(-4,4),r*0.62);
 }

 // trailing water plants creeping in from the edges
 const vineCount=Math.round((w+h)/330)+3;
 for(let v=0;v<vineCount;v++){
   let x,y,ang;
   const side=Math.floor(rand()*4);
   if(side===0){x=rand()*w;y=-10;ang=Math.PI/2+rr(-0.7,0.7);}
   else if(side===1){x=w+10;y=rand()*h;ang=Math.PI+rr(-0.7,0.7);}
   else if(side===2){x=rand()*w;y=h+10;ang=-Math.PI/2+rr(-0.7,0.7);}
   else{x=-10;y=rand()*h;ang=rr(-0.7,0.7);}
   const col=rand()<0.55?"rgba(255,226,170,0.78)":"rgba(232,122,46,0.82)";
   growVine(o,x,y,ang,Math.min(w,h)*rr(0.4,0.8),rr(2.4,3.2),2,col);
 }

 // 5. Wear: rub patches, specks and scratches off the ornament
 o.globalCompositeOperation="destination-out";

 for(let i=0;i<14;i++){
   const x=rand()*w, y=rand()*h, r=rr(60,200);
   const rg=o.createRadialGradient(x,y,0,x,y,r);
   const a=rr(0.30,0.65);
   rg.addColorStop(0,"rgba(0,0,0,"+a+")");
   rg.addColorStop(1,"rgba(0,0,0,0)");
   o.fillStyle=rg;
   o.fillRect(x-r,y-r,r*2,r*2);
 }

 const specks=Math.floor(w*h/300);
 for(let i=0;i<specks;i++){
   o.fillStyle="rgba(0,0,0,"+rr(0.3,0.9)+")";
   o.beginPath();
   o.arc(rand()*w,rand()*h,rr(0.5,2.0),0,Math.PI*2);
   o.fill();
 }

 o.lineCap="round";
 for(let i=0;i<28;i++){
   const x=rand()*w, y=rand()*h, a=rand()*Math.PI*2, l=rr(18,80);
   o.strokeStyle="rgba(0,0,0,"+rr(0.3,0.65)+")";
   o.lineWidth=rr(0.5,1.3);
   o.beginPath();
   o.moveTo(x,y);
   o.quadraticCurveTo(
     x+Math.cos(a+0.3)*l*0.5,y+Math.sin(a+0.3)*l*0.5,
     x+Math.cos(a)*l,y+Math.sin(a)*l
   );
   o.stroke();
 }
 o.globalCompositeOperation="source-over";

 // 6. Lay the ornament on the water with a faint shadow
 g.save();
 g.shadowColor="rgba(0,18,60,0.38)";
 g.shadowBlur=2;
 g.shadowOffsetX=1;
 g.shadowOffsetY=1;
 g.drawImage(orn,0,0);
 g.restore();

 // 7. Soft vignette for depth and readability
 const vg=g.createRadialGradient(
   w/2,h/2,Math.min(w,h)*0.2,
   w/2,h/2,Math.max(w,h)*0.75
 );
 vg.addColorStop(0,"rgba(0,20,75,0)");
 vg.addColorStop(1,"rgba(6,12,48,0.45)");
 g.fillStyle=vg;
 g.fillRect(0,0,w,h);

 patternLayer=base;
}

// Live ripples: now and then a drop touches the pond and rings spread out and fade
let liveRipples=[];
let nextRippleAt=0;

function drawLiveRipples(now){

 if(now>=nextRippleAt){
   liveRipples.push({
     x:Math.random()*c.width,
     y:Math.random()*c.height,
     born:now,
     life:7000+Math.random()*3000,
     max:110+Math.random()*110
   });
   if(liveRipples.length>6) liveRipples.shift();
   nextRippleAt=now+1800+Math.random()*2600;
 }

 liveRipples=liveRipples.filter(r=>now-r.born<r.life);

 for(const r of liveRipples){
   const p=(now-r.born)/r.life;
   const ease=1-Math.pow(1-p,2);
   for(let k=0;k<4;k++){
     const pk=ease-k*0.11;
     if(pk<=0) continue;
     const rad=r.max*pk;
     const alpha=(1-p)*(1-k*0.2)*0.38;
     ctx.strokeStyle=(k===2)
       ?"rgba(255,170,90,"+alpha+")"
       :"rgba(255,240,205,"+alpha+")";
     ctx.lineWidth=1.8-k*0.3;
     ctx.beginPath();
     ctx.ellipse(r.x,r.y,rad,rad*0.58,0,0,Math.PI*2);
     ctx.stroke();
   }
 }
}

function resize(){
 c.width=window.innerWidth;
 c.height=window.innerHeight;
 try{
   buildPattern();
 }catch(e){
   console.warn("Background pattern unavailable:",e);
   patternLayer=null;
 }
}

let resizeTimeout=null;
window.addEventListener("resize",()=>{
 clearTimeout(resizeTimeout);
 resizeTimeout=setTimeout(resize,150);
});

let lastFrame=0;

function animate(){

 if(!isPageVisible) return;

 const frameNow=performance.now();
 if(frameNow-lastFrame<33){
   animationFrameId = requestAnimationFrame(animate);
   return;
 }
 lastFrame=frameNow;

 try{

   if(patternLayer){
     ctx.drawImage(patternLayer,0,0);
   }else{
     ctx.fillStyle="rgb(14,124,136)";
     ctx.fillRect(0,0,c.width,c.height);
   }

   // very slow, gentle light sweep for a shimmering glaze effect
   const t=performance.now()*0.00004;
   const lx=c.width*(0.5+0.4*Math.sin(t));
   const ly=c.height*(0.5+0.3*Math.cos(t*0.8));

   const glow=ctx.createRadialGradient(lx,ly,0,lx,ly,Math.max(c.width,c.height)*0.5);
   glow.addColorStop(0,"rgba(255,245,210,0.10)");
   glow.addColorStop(1,"rgba(255,245,210,0)");
   ctx.fillStyle=glow;
   ctx.fillRect(0,0,c.width,c.height);

   drawLiveRipples(performance.now());

 }catch(e){

   console.warn("Background render error:",e);

 }

 animationFrameId = requestAnimationFrame(animate);
}

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    isPageVisible = false;
    if (animationFrameId) cancelAnimationFrame(animationFrameId);
  } else {
    isPageVisible = true;
    animate();
  }
});

resize();
animate();


// TIMER (Robust against sleep throttling)
let memoryStorage={};

function safeGetStorage(key){
try{
return localStorage.getItem(key);
}catch(e){
return memoryStorage[key]||null;
}
}

function safeSetStorage(key,value){
try{
localStorage.setItem(key,value);
}catch(e){
memoryStorage[key]=value;
}
}

function safeRemoveStorage(key){
try{
localStorage.removeItem(key);
}catch(e){
delete memoryStorage[key];
}
}

let timerInterval=null;
const timerBtn=document.getElementById("timerBtn");
const timerDisplay=document.getElementById("timerDisplay");
const timerModal=document.getElementById("timerModal");

const timerBackdrop=document.getElementById("timerBackdrop");

timerBtn.onclick=()=>{
document.getElementById("tmStop").style.display=
safeGetStorage("sleepTimerEnd")?"inline-flex":"none";
timerBackdrop.style.display="block";
timerModal.style.display="block";
}

function closeTimer(){
timerModal.style.display="none";
timerBackdrop.style.display="none";
}

function cancelTimer(){
if(timerInterval) clearInterval(timerInterval);
safeRemoveStorage("sleepTimerEnd");
audio.volume=1;
timerDisplay.innerText="";
timerBtn.classList.remove("activeButton");
closeTimer();
}

document.addEventListener("keydown",e=>{
if(e.key==="Escape")closeTimer();
});

function startCustomTimer(){
let h=Math.max(0,parseInt(document.getElementById("th").value)||0);
let m=Math.max(0,parseInt(document.getElementById("tm").value)||0);
if(h*60+m<=0){
document.getElementById("tm").focus();
return;
}
startTimer(h*60+m);
}

function startTimer(minutes){
minutes=Number(minutes);
if(!isFinite(minutes)||minutes<=0)return;
closeTimer();
audio.volume=1;
let timerSeconds=minutes*60;
safeSetStorage("sleepTimerEnd",Date.now()+timerSeconds*1000);

if(timerInterval) clearInterval(timerInterval);

timerInterval=setInterval(updateTimer,250);
updateTimer();
}

function updateTimer(){
let stored=safeGetStorage("sleepTimerEnd");
if(!stored)return;

let end=Number(stored);

if(!isFinite(end)){
clearInterval(timerInterval);
safeRemoveStorage("sleepTimerEnd");
timerBtn.classList.remove("activeButton");
timerDisplay.innerText="";
return;
}

let remainingSeconds=Math.ceil((end-Date.now())/1000);

if(remainingSeconds<=0){
clearInterval(timerInterval);
timerBtn.classList.remove("activeButton");
audio.pause();
audio.volume=1;
setIcon(playBtn,"play");
timerDisplay.innerText="";
safeRemoveStorage("sleepTimerEnd");
title.innerText="Listening session ended";
return;
}

timerBtn.classList.add("activeButton");

if(remainingSeconds<=15){
audio.volume=Math.max(0,remainingSeconds/15);
}

let h=Math.floor(remainingSeconds/3600);
let m=Math.floor((remainingSeconds%3600)/60);
let sec=remainingSeconds%60;

timerDisplay.innerText=
(h>0?h+":"+(m<10?"0":""):"")+m+":"+(sec<10?"0":"")+sec;
}

window.addEventListener("load",()=>{
let end=Number(safeGetStorage("sleepTimerEnd"));
if(!isFinite(end)||end<=Date.now()){
safeRemoveStorage("sleepTimerEnd");
end=0;
}
if(end){
timerInterval=setInterval(updateTimer,250);
updateTimer();
}
});
